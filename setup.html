<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
<title>DeepSeek Harness 安装程序</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none;
    color: #1f1f1f;
  }
  /* 拖拽：整张卡片可拖（输入框/按钮除外） */
  #card { -webkit-app-region: drag; }
  #card input, #card button, #card .no-drag { -webkit-app-region: no-drag; }

  body { display: flex; align-items: center; justify-content: center; }
  #card {
    width: 560px; height: 400px;
    background: #ffffff;
    border-radius: 20px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.28), 0 4px 16px rgba(0, 0, 0, 0.08);
    display: flex; overflow: hidden;
    position: relative;
    animation: cardIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* 左侧品牌区 */
  #brand {
    width: 190px; flex: none;
    background: linear-gradient(165deg, #f2f6fd 0%, #ffffff 45%, #f6f1fd 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px 20px;
    border-right: 1px solid rgba(0, 0, 0, 0.06);
  }
  #whale {
    width: 72px; height: 72px; border-radius: 20px;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 8px 24px rgba(26, 115, 232, 0.14);
    display: flex; align-items: center; justify-content: center;
    color: #111;
  }
  #brand h1 { font-size: 17px; font-weight: 700; margin-top: 14px; text-align: center; line-height: 1.35; letter-spacing: 0.01em; }
  #brand p { font-size: 11.5px; color: #5f6368; margin-top: 6px; }
  #ver { margin-top: auto; font-size: 10.5px; color: #9aa0a6; font-family: ui-monospace, Consolas, monospace; }

  /* 右侧内容区 */
  #main { flex: 1; display: flex; flex-direction: column; padding: 22px 24px 18px; min-width: 0; }
  #close {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; border: none; border-radius: 50%;
    background: transparent; color: #5f6368; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #close:hover { background: rgba(0,0,0,0.07); color: #1f1f1f; }
  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; animation: viewIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes viewIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
  h2 { font-size: 18px; font-weight: 650; letter-spacing: 0.01em; }
  .sub { font-size: 12.5px; color: #5f6368; margin-top: 6px; line-height: 1.6; }

  #path-row { display: flex; gap: 8px; margin-top: 14px; }
  #path {
    flex: 1; min-width: 0; height: 34px; padding: 0 12px;
    border: 1px solid rgba(0,0,0,0.14); border-radius: 10px;
    font: 12.5px ui-monospace, Consolas, monospace; color: #1f1f1f;
    background: #f8f9fa; outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #path:focus { border-color: #1a73e8; background: #fff; }
  #browse {
    flex: none; height: 34px; padding: 0 14px;
    border: 1px solid rgba(0,0,0,0.1); border-radius: 10px;
    background: #f1f3f4; color: #1f1f1f; font-size: 12.5px; cursor: pointer;
    transition: background 0.15s ease;
  }
  #browse:hover { background: #e4e7ea; }
  #opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .opt {
    display: flex; align-items: center; gap: 9px;
    font-size: 12.5px; color: #3c4043; cursor: pointer;
    padding: 7px 10px; border-radius: 9px;
    transition: background 0.13s ease;
  }
  .opt:hover { background: rgba(26, 115, 232, 0.06); }
  .opt input { accent-color: #1a73e8; width: 15px; height: 15px; cursor: pointer; }
  #space { font-size: 11.5px; color: #9aa0a6; margin-top: 10px; }

  /* 进度 */
  #bar-bg { height: 8px; border-radius: 99px; background: rgba(0,0,0,0.08); margin-top: 18px; overflow: hidden; }
  #bar { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, #1a73e8, #7baaf7); transition: width 0.18s ease; }
  #pct-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
  #pct { font: 600 13px ui-monospace, Consolas, monospace; color: #1a73e8; }
  #ticker { font-size: 11.5px; color: #5f6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
  #done-icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(52, 168, 83, 0.12); color: #34a853;
    display: flex; align-items: center; justify-content: center;
    margin: 14px 0 6px;
    animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #err-box {
    display: none; margin-top: 12px; padding: 9px 12px; border-radius: 10px;
    background: rgba(220, 38, 38, 0.07); border: 1px solid rgba(220, 38, 38, 0.25);
    color: #b3261e; font-size: 12px; line-height: 1.55; word-break: break-all;
    max-height: 96px; overflow: auto;
  }

  #footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: auto; padding-top: 14px; }
  .btn {
    height: 34px; padding: 0 22px; border-radius: 999px; font-size: 13px; font-weight: 550;
    cursor: pointer; border: none; transition: opacity 0.15s ease, transform 0.1s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #1a73e8; color: #fff; box-shadow: 0 4px 14px rgba(26, 115, 232, 0.32); }
  .btn-primary:hover { background: #1765cc; }
  .btn-primary:disabled { opacity: 0.55; cursor: default; box-shadow: none; }
  .btn-ghost { background: transparent; color: #5f6368; }
  .btn-ghost:hover { background: rgba(0,0,0,0.06); color: #1f1f1f; }
</style>
</head>
<body>
  <div id="card">
    <div id="brand">
      <div id="whale">

1.5854-1.8775.2095-5.01.2552-7.1532-1.4397Z"/></svg>
      </div>
      <h1>DeepSeek<br />Harness</h1>
      <p>桌面壳 · 开箱即用</p>
      <span id="ver">v1.2.0</span>
    </div>
    <div id="main">
      <button id="close" title="取消安装"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button>

      <div class="view active" id="view-welcome">
        <h2>欢迎使用</h2>
        <p class="sub">默认安装到 <b>D 盘</b>，可自行更改路径。<br />约需 600 MB 磁盘空间，1 分钟内完成。</p>
        <div id="path-row">
          <input id="path" class="no-drag" spellcheck="false" value="D:\DeepSeek Harness" />
          <button id="browse" class="no-drag">浏览…</button>
        </div>
        <div id="opts">
          <label class="opt no-drag"><input type="checkbox" id="opt-desktop" checked /> 创建桌面快捷方式</label>
          <label class="opt no-drag"><input type="checkbox" id="opt-start" checked /> 创建开始菜单快捷方式</label>
          <label class="opt no-drag"><input type="checkbox" id="opt-run" checked /> 完成后启动应用</label>
        </div>
        <div id="space">已检测到 D 盘，将默认安装到 D:\DeepSeek Harness</div>
        <div id="footer">
          <button class="btn btn-ghost" id="btn-cancel">取消</button>
          <button class="btn btn-primary" id="btn-install">安装</button>
        </div>
      </div>

      <div class="view" id="view-progress">
        <h2 id="prog-title">正在安装…</h2>
        <p class="sub" id="prog-sub">正在解压应用文件，请稍候。</p>
        <div id="bar-bg"><div id="bar"></div></div>
        <div id="pct-row"><span id="pct">0%</span><span id="ticker"></span></div>
        <div id="err-box"></div>
        <div id="footer">
          <button class="btn btn-ghost" id="btn-close2" style="display:none">关闭</button>
        </div>
      </div>

      <div class="view" id="view-done">
        <div id="done-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
        <h2>安装完成</h2>
        <p class="sub" id="done-sub">已安装到 D:\DeepSeek Harness</p>
        <div id="footer">
          <button class="btn btn-ghost" id="btn-close3">关闭</button>
          <button class="btn btn-primary" id="btn-launch">立即启动</button>
        </div>
      </div>
    </div>
  </div>
  <script src="setup-renderer.js"></script>
</body>
</html>
